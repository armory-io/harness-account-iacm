# Runs on every PR: plan both workspaces, apply nothing. Plans are the review artifact.
# [Verify] IACM stage/step YAML against your account's schema (same caveat as the templates sample pipeline).
pipeline:
  name: IACM Plan Account
  identifier: IACM_Plan_Account
  projectIdentifier: platform_iacm
  orgIdentifier: default
  stages:
    - stage:
        name: Plan Sandbox
        identifier: Plan_Sandbox
        type: IACM
        spec:
          workspace: account_sandbox
          cloneCodebase: true
          platform: { os: Linux, arch: Amd64 }
          runtime: { type: Cloud, spec: {} }
          execution:
            steps:
              - step: { type: IACMTerraformPlugin, name: init, identifier: init_sbx, timeout: 10m, spec: { command: init } }
              - step: { type: IACMTerraformPlugin, name: plan, identifier: plan_sbx, timeout: 10m, spec: { command: plan } }
    - stage:
        name: Plan Production
        identifier: Plan_Production
        type: IACM
        spec:
          workspace: account_production
          cloneCodebase: true
          platform: { os: Linux, arch: Amd64 }
          runtime: { type: Cloud, spec: {} }
          execution:
            steps:
              - step: { type: IACMTerraformPlugin, name: init, identifier: init_prod, timeout: 10m, spec: { command: init } }
              - step: { type: IACMTerraformPlugin, name: plan, identifier: plan_prod, timeout: 10m, spec: { command: plan } }
