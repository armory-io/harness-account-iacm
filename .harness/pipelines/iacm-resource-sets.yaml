# Runs on merge to main (and on PRs touching resource_sets/, modules/resource_set/, accounts/production/resource_sets.tf).
# Production only: no sandbox, canary or sign-off stage; the reviewed PR is the gate. The one automatic stop is
# the destroy check: a plan that deletes anything fails the run before apply.
# [Verify] IACM step types and the plan-json hand-off below against a live account; the check fails closed.
pipeline:
  name: IACM Apply Resource Sets
  identifier: IACM_Apply_Resource_Sets
  projectIdentifier: Template_Promotion_Management
  orgIdentifier: InternalOps
  stages:
    - stage:
        name: Apply Resource Sets
        identifier: Apply_Resource_Sets
        type: IACM
        spec:
          workspace: account_production
          cloneCodebase: true
          platform: { os: Linux, arch: Amd64 }
          runtime: { type: Cloud, spec: {} }
          execution:
            steps:
              - step: { type: IACMTerraformPlugin, name: init, identifier: init, timeout: 10m, spec: { command: init } }
              - step: { type: IACMTerraformPlugin, name: plan, identifier: plan, timeout: 10m, spec: { command: plan } }
              - step:
                  type: Run
                  name: No Destroys
                  identifier: No_Destroys
                  spec:
                    shell: Bash
                    command: |
                      set -euo pipefail
                      # Fail closed: the plan JSON must be found and must contain no delete action.
                      plan_json="${PLAN_JSON:?set PLAN_JSON to the plan step's JSON output}"
                      n=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$plan_json")
                      if [ "$n" -ne 0 ]; then
                        echo "plan deletes $n resource(s); resource sets are create/update only. Stopping before apply." >&2
                        exit 1
                      fi
              - step: { type: IACMApproval, name: approve, identifier: approve, timeout: 1h, spec: { autoApprove: true } }   # PR review is the gate
              - step: { type: IACMTerraformPlugin, name: apply, identifier: apply, timeout: 10m, spec: { command: apply } }
